<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Leaderboard - CarbEarn</title>

    <link rel="stylesheet"
        href="css/style.css">

</head>


<body>

    <header class="navbar">

        <div class="logo">
            CarbEarn
        </div>

        <nav class="nav-links">

            <a href="dashboard.html">
                Dashboard
            </a>

            <a href="activities.html">
                Activities
            </a>

            <a href="history.html">
                History
            </a>

            <a href="leaderboard.html">
                Leaderboard
            </a>

            <a href="#"
                id="logoutButton"
                class="nav-button">
                Logout
            </a>

        </nav>

    </header>


    <main class="leaderboard-page">


        <section class="leaderboard-header">

            <p class="hero-label">
                CARBEARN COMMUNITY
            </p>

            <h1>
                Green
                <span>Leaderboard.</span>
            </h1>

            <p>
                See how CarbEarn users are contributing
                through their eco-friendly activities.
            </p>

        </section>


        <section class="leaderboard-card">


            <div class="leaderboard-card-header">

                <div>

                    <p class="hero-label">
                        RANKINGS
                    </p>

                    <h2>
                        Top Contributors
                    </h2>

                </div>

                <div
                    id="totalUsers"
                    class="user-count">
                    0 users
                </div>

            </div>


            <div
                id="leaderboardContainer"
                class="leaderboard-container">

                <p class="loading-text">
                    Loading leaderboard...
                </p>

            </div>


        </section>


    </main>


    <footer>

        <div class="footer-logo">
            CarbEarn
        </div>

        <p>
            Smart Carbon Footprint Tracking System
        </p>

    </footer>


    <script src="js/leaderboard.js"></script>

</body>

</html>
